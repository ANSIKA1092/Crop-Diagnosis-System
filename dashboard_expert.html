<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expert Dashboard - Crop Diagnosis System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #e3f2fd, #ffffff);
      min-height: 100vh;
      padding: 40px 20px;
    }

    h2 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 30px;
      font-size: 2em;
    }

    #caseList {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .case-card {
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-left: 6px solid #1565c0;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .case-card h3 {
      margin-bottom: 10px;
      color: #0d47a1;
    }

    .case-card p {
      margin-bottom: 15px;
      color: #333;
    }

    .case-card button {
      padding: 10px 20px;
      font-size: 1em;
      color: #fff;
      background-color: #1976d2;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .case-card button:hover {
      background-color: #0d47a1;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
<body>
  <h2>Pending Cases</h2>
  <div id="caseList"></div>

  <footer>© 2025 Crop Diagnosis System. Expert Portal</footer>

  <script>
    async function loadCases() {
      const res = await fetch('http://localhost:3000/api/cases?crop=rice&status=Pending');
      const cases = await res.json();
      const container = document.getElementById('caseList');
      cases.forEach(c => {
        const div = document.createElement('div');
        div.className = 'case-card';
        div.innerHTML = `
          <h3>${c.cropType} – ${c.location}</h3>
          <p>${c.description}</p>
          <button onclick="diagnose('${c._id}')">Diagnose</button>
        `;
        container.appendChild(div);
      });
    }

    async function diagnose(caseId) {
      const diagnosis = {
        caseId,
        expertId: "EXPERT_ID",
        diseaseLabel: "Nutrient Deficiency",
        confidence: 90,
        remedyText: "Apply nitrogen fertilizer"
      };
      await fetch('http://localhost:3000/api/diagnoses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(diagnosis)
      });
      alert('Diagnosis submitted');
    }

    loadCases();
  </script>
</body>
</html>
